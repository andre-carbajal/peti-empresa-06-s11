services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peti_s11
      POSTGRES_USER: peti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - peti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peti -d peti_s11"]
      interval: 5s
      retries: 10
  metabase:
    image: metabase/metabase:v0.52.12
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: peti_s11
      MB_DB_PORT: 5432
      MB_DB_USER: peti
      MB_DB_PASS: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      MB_DB_HOST: postgres
    restart: unless-stopped
volumes:
  peti_pgdata:
